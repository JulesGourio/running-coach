name: Tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  pc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --locked
      - run: uv run pytest -q

  # The phone runs the engine with Chaquopy's builds: pandas 2.1 and numpy 1.26, without the PC-only libraries.
  phone-libs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "pandas==2.1.3" "numpy==1.26.2" httpx fitdecode python-dotenv pytest respx fit-tool
      - run: python -m pytest -q --ignore=tests/test_mcp_server.py --ignore=tests/test_coros_mcp.py
