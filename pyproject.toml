[project]
name = "running-coach"
version = "0.1.0"
description = "Coach de course à pied local branché sur COROS"
requires-python = ">=3.11"
dependencies = [
    "mcp>=1.9",
    "httpx>=0.27",
    "fitdecode>=0.10",
    "pandas>=2.2",
    "numpy>=1.26",
    "streamlit>=1.38",
    "plotly>=5.22",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-dotenv>=1.0",
]

[project.scripts]
coach = "coach.cli:main"
coach-mcp = "coach.mcp_server:main"

[dependency-groups]
dev = ["pytest>=8", "respx>=0.21", "fit-tool>=0.9"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["coach"]

[tool.pytest.ini_options]
testpaths = ["tests"]
